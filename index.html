<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Light of the Lost</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0a1b;color:#efe4cc;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right))}
header img{height:44px;width:auto;display:block}
.btns{display:flex;gap:8px}
button,a.btn{font:inherit;font-size:12px;padding:8px 12px;background:transparent;color:#ffe08a;border:1px solid #e2b553;border-radius:2px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{background:rgba(226,181,83,.15)}
main{flex:1;min-height:0;display:grid;place-items:center;padding:0 12px max(12px,env(safe-area-inset-bottom))}
#stage{width:100%;height:100%;background:#000;border:2px solid #e2b553}
#stage iframe{width:100%;height:100%;border:0;display:block}
#stage:fullscreen{border:0}
</style>
</head>
<body>
<header>
  <img src="assets/logo.webp" alt="Light of the Lost: A Monk's Tale">
  <div class="btns">
    <a class="btn" href="game/index.html" target="_blank" rel="noopener">New tab</a>
    <button id="fs" type="button">Full screen</button>
  </div>
</header>
<main>
  <div id="stage"><iframe id="game" src="game/index.html" title="Light of the Lost" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>
</main>
<script>
const stage=document.getElementById('stage'),game=document.getElementById('game');
document.getElementById('fs').onclick=()=>{(stage.requestFullscreen||stage.webkitRequestFullscreen||(()=>window.open('game/index.html'))).call(stage);game.focus()};
game.addEventListener('load',()=>game.focus());
</script>
</body>
</html>
